name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The capture harness and the hook are zsh; without this their tests
      # skip and CI silently covers none of it.
      - run: sudo apt-get update -qq && sudo apt-get install -qq -y zsh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Every merge to main is a minor release. Lives here rather than in its own
  # workflow so it inherits `needs: test` instead of re-running the suite.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two merges landing at once would both bump from the same base version.
    concurrency: release
    permissions:
      contents: write # push the bump commit, tag, and GitHub release
      id-token: write # crates.io trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      # Cargo reads the version from the checked-in file, so the bump has to be
      # a real commit on main; the tag alone would publish the previous version.
      - run: cargo set-version --bump minor
      - id: v
        run: echo "v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> "$GITHUB_OUTPUT"

      # Before the push, so a registry or trusted-publishing problem fails while
      # main is still untouched rather than after it has been bumped and tagged.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Pushed with GITHUB_TOKEN, which by design does not trigger workflows —
      # that is what keeps this job from re-triggering itself forever.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $V"
          git tag -a "v$V" -m "v$V"
          git push origin HEAD:main "v$V"
        env:
          V: ${{ steps.v.outputs.v }}

      # Still after the push: a failed publish leaves a tag with no crate and the
      # next merge just moves on to the next version. Publishing first and then
      # failing to push would strand a version that main does not know it used,
      # and every later run would collide with it.
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - run: gh release create "v$V" --generate-notes
        env:
          V: ${{ steps.v.outputs.v }}
          GH_TOKEN: ${{ github.token }}
